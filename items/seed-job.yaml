items:
  - kind: pipeline
    name: seed
    displayName: "Job DSL Seed"
    description: "Seed job generating a folder and a pipeline job via the job-dsl plugin."
    definition:
      script: |
        pipeline {
            agent { label 'python' }
            stages {
                stage('Seed') {
                    steps {
                        jobDsl sandbox: true, scriptText: '''
                            folder('generated') {
                                description('Jobs generated by the seed job')
                            }
                            pipelineJob('generated/hello-generated') {
                                definition {
                                    cps {
                                        script(\'\'\'
                                            pipeline {
                                                agent none
                                                stages {
                                                    stage('Echo') {
                                                        steps {
                                                            echo 'generated job says hi'
                                                        }
                                                    }
                                                }
                                            }
                                        \'\'\'.stripIndent())
                                        sandbox(true)
                                    }
                                }
                            }
                        '''
                    }
                }
            }
        }
