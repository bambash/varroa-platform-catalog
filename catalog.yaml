apiVersion: "1"
name: varroa-platform-catalog
description: "Blessed platform catalog for Varroa — JCasC templates, plugins, pod templates, Jobs, and RBAC curated for production Jenkins controllers."

items:
  # ---- Pod Templates ----
  - type: podtemplate
    name: maven-jdk21
    displayName: "Maven + JDK 21 Agent"
    description: "Kubernetes agent pod with Maven 3.9 and Temurin JDK 21, 2Gi heap, ephemeral .m2 cache volume."
    path: pod-templates/maven-jdk21.yaml
    version: "1.4.0"
    tags: [java, maven, jdk21]

  - type: podtemplate
    name: node20-playwright
    displayName: "Node 20 + Playwright"
    description: "Node 20 agent preloaded with Playwright browsers for end-to-end UI test stages."
    path: pod-templates/node20-playwright.yaml
    version: "2.2.0"
    tags: [node, e2e, playwright]

  - type: podtemplate
    name: dind
    displayName: "Docker-in-Docker Builder"
    description: "Privileged DinD agent (docker:27-dind, label 'dind') with resource limits; pods never idle or linger."
    path: pod-templates/dind.yaml
    version: "1.1.0"
    tags: [docker, buildkit]

  - type: podtemplate
    name: kaniko
    displayName: "Kaniko Image Builder"
    description: "Rootless container image builds with kaniko executor (label 'kaniko'); no privileged sidecar required."
    path: pod-templates/kaniko.yaml
    version: "1.1.0"
    tags: [docker, kaniko, rootless]

  - type: podtemplate
    name: python312
    displayName: "Python 3.12 Agent"
    description: "Python 3.12 slim agent (label 'python') for scripting, tooling, and seed-job stages; 5-minute warm idle."
    path: pod-templates/python312.yaml
    version: "1.0.0"
    tags: [python]

  - type: podtemplate
    name: golang
    displayName: "Go Build Agent"
    description: "Kubernetes agent pod with Go 1.26 (bookworm, cgo-capable for -race), emptyDir module/build caches, 5-minute warm idle."
    path: pod-templates/golang.yaml
    version: "1.0.0"
    tags: [go, ci]

  # ---- Plugins ----
  - type: plugin
    name: pipeline-suite
    displayName: "Pipeline Suite"
    description: "workflow-aggregator + pipeline-stage-view + pipeline-graph-view, pinned to LTS-compatible versions."
    path: plugins/pipeline.yaml
    version: bundle
    tags: [pipeline, core]

  - type: plugin
    name: kubernetes-agents
    displayName: "Kubernetes Agents"
    description: "kubernetes + kubernetes-credentials plugins required for ephemeral pod agents."
    path: plugins/kubernetes.yaml
    version: bundle
    tags: [k8s, agents]

  - type: plugin
    name: git-github
    displayName: "Git + GitHub"
    description: "git, github-branch-source, and multibranch scan webhook plugins."
    path: plugins/scm.yaml
    version: bundle
    tags: [git, scm, github]

  - type: plugin
    name: sonarqube-scanner
    displayName: "SonarQube Scanner"
    description: "SonarQube scanner + quality-gate webhook integration plugin."
    path: plugins/sonar.yaml
    version: bundle
    tags: [quality, sonar]

  - type: plugin
    name: varroa-theme-plugin
    displayName: "Varroa Theme Plugin"
    description: "simple-theme-plugin required for Varroa-branded Jenkins CSS themes."
    path: plugins/theme.yaml
    version: bundle
    tags: [theme, simple-theme]

  - type: plugin
    name: cicd-tools
    displayName: "CI/CD Toolchain"
    description: "job-dsl, docker-workflow, nodejs, jdk-tool, maven-plugin, and config-file-provider pinned to the platform plugin lock."
    path: plugins/cicd-tools.yaml
    version: bundle
    tags: [job-dsl, docker, tools]

  - type: plugin
    name: varroa-mcp-tools
    displayName: "Varroa MCP Tools"
    description: "Varroa's Jenkins-side MCP tool extensions, served only from the in-cluster update center."
    path: plugins/varroa-mcp-tools.yaml
    version: bundle
    tags: [mcp, varroa]

  # ---- Items ----
  - type: item
    name: multibranch-pipeline
    displayName: "Multibranch Pipeline"
    description: "Parameterized multibranch pipeline scaffold scanning a GitHub org with PR discovery + 30-day orphan cleanup."
    path: items/multibranch.yaml
    version: "1.2.0"
    tags: [job, multibranch]
    variables:
      - { name: repo_name, description: "GitHub repository name", required: true }
      - { name: org, description: "GitHub organization or user", required: true }

  - type: item
    name: team-folder
    displayName: "Team Folder + Views"
    description: "Top-level folder with build-status and failed-only list views and folder-scoped credentials store."
    path: items/team-folder.yaml
    version: "1.0.0"
    tags: [folder, org]
    variables:
      - { name: team, description: "Team name used as folder name", required: true }

  - type: item
    name: dind-smoke
    displayName: "DinD Smoke Test"
    description: "Pipeline running docker run --rm hello-world inside the dind pod template."
    path: items/dind-smoke.yaml
    version: "1.0.0"
    tags: [job, docker, smoke]

  - type: item
    name: lib-demo
    displayName: "Shared Library Demo"
    description: "Pipeline loading the varroa-shared library and greeting from a python agent pod."
    path: items/lib-demo.yaml
    version: "1.0.0"
    tags: [job, shared-library]

  - type: item
    name: varroa-ci
    displayName: "Varroa CI (Dogfood)"
    description: "Declarative pipeline that builds and tests varroa-jenkins on a Varroa-managed controller: lint, race tests, generated-code drift checks, vulncheck, frontend, and no-push kaniko image builds."
    path: items/varroa-ci.yaml
    version: "1.2.0"
    tags: [job, ci, dogfood]

  - type: jcasc
    name: seed-jobs
    displayName: "Seed Jobs (Job DSL)"
    description: "Seeds a generated folder and pipeline job through the JCasC jobs: root — runs as SYSTEM, no run-as configuration needed."
    path: jcasc/seed-jobs.yaml
    version: "2.0.0"
    tags: [job-dsl, seed, jcasc]

  - type: item
    name: nightly-freestyle
    displayName: "Nightly Freestyle Cron"
    description: "Legacy-style freestyle cron job; every real fleet still carries a few."
    path: items/nightly-freestyle.yaml
    version: "1.0.0"
    tags: [job, freestyle, legacy]

  # ---- JCasC ----
  - type: jcasc
    name: global-security
    displayName: "Global Security Hardening"
    description: "Disables CLI over remoting, enforces CSRF crumbs, agent-to-controller access control, and markup formatter."
    path: jcasc/security.yaml
    version: "1.1.0"
    tags: [security, csrf]

  - type: jcasc
    name: varroa-theme
    displayName: "Varroa Branded Theme"
    description: "Applies the Varroa visual identity (honey/caramel palette, warm surfaces) to the Jenkins UI via simple-theme-plugin."
    path: jcasc/varroa-theme.yaml
    version: "1.0.0"
    tags: [theme, branding, varroa]

  - type: jcasc
    name: k8s-cloud
    displayName: "Kubernetes Cloud (In-Cluster)"
    description: "In-cluster Kubernetes cloud for dynamic agent pods. Namespace and Jenkins URL injected per-controller via varroa_controller_* vars."
    path: jcasc/k8s-cloud.yaml
    version: "1.0.0"
    tags: [kubernetes, agents, cloud]

  - type: jcasc
    name: global-tools
    displayName: "Global Tool Installations"
    description: "JDK 21, Maven 3.9, Node 20, and git tool installations plus a managed global Maven settings file."
    path: jcasc/global-tools.yaml
    version: "1.0.0"
    tags: [tools, jdk, maven, node]

  - type: jcasc
    name: credentials-fixtures
    displayName: "Dummy Credential Fixtures"
    description: "Global-scope dummy usernamePassword and secret-text credentials for test controllers. Not real secrets."
    path: jcasc/credentials.yaml
    version: "1.0.0"
    tags: [credentials, fixtures]

  - type: jcasc
    name: ci-scm-credential
    displayName: "CI SCM Deploy Key"
    description: "SSH deploy-key credential (varroa-ci-deploy-key) sourced from a mounted Secret via readFile, plus accept-first-connection SSH host-key verification. Consumers MUST mount the Secret at /run/secrets/ssh-privatekey and set CASC_STRICT_SECRET_RESOLUTION=true, or the credential is silently created with an empty key."
    path: jcasc/ci-scm-credential.yaml
    version: "1.0.0"
    tags: [credentials, ssh, ci]

  - type: jcasc
    name: team-views
    displayName: "Team List Views"
    description: "A recursive 'CI' list view over smoke/seed/nightly/generated jobs alongside the default all view."
    path: jcasc/views.yaml
    version: "1.0.0"
    tags: [views]

  - type: jcasc
    name: shared-library
    displayName: "Varroa Shared Pipeline Library"
    description: "Global pipeline library 'varroa-shared' retrieved from this catalog repo's pipeline-library/ directory."
    path: jcasc/shared-library.yaml
    version: "1.0.0"
    tags: [shared-library, pipeline]

  # ---- RBAC ----
  - type: rbac
    name: developer-roles
    displayName: "Developer Role Set"
    description: "Global read + per-folder build/cancel for the 'developers' group."
    path: rbac/developers.yaml
    version: "1.0.0"
    tags: [rbac, roles]

  - type: rbac
    name: auditor-role
    displayName: "Read-Only Auditor"
    description: "Overall/Read + Job/Read across all folders for compliance auditors. No build or configure rights."
    path: rbac/auditor.yaml
    version: "1.0.0"
    tags: [rbac, audit]
