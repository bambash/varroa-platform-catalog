- name: scale-agent
  label: scale-agent
  idleMinutes: 0
  podRetention: "never"
  nodeSelector: "pool=workloads"
  yamlMergeStrategy: "merge"
  yaml: |
    spec:
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "jenkins-workloads"
          effect: "NoSchedule"
  containers:
    - name: busybox
      image: busybox:1.36
      command: sleep
      args: 99d
      ttyEnabled: true
      workingDir: /home/jenkins/agent
      resourceRequestCpu: "50m"
      resourceRequestMemory: "64Mi"
      resourceLimitCpu: "200m"
      resourceLimitMemory: "128Mi"
