credentials:
  system:
    domainCredentials:
      - credentials:
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: "varroa-ci-deploy-key"
              username: "git"
              description: "Read-only deploy key for bambash/varroa-jenkins (dogfood CI)"
              privateKeySource:
                directEntry:
                  privateKey: ${readFile:/run/secrets/ssh-privatekey}
security:
  gitHostKeyVerificationConfiguration:
    sshHostKeyVerificationStrategy: "acceptFirstConnectionStrategy"
